# ============== ABOUT US ==============
nosotros.titulo=About us · Ideal-Trip
nosotros.hero.titulo=About Ideal-Trip
nosotros.hero.subtitulo=We design trips that become memories.

nosotros.mision.titulo=Our mission
nosotros.mision.texto=To enable access to memorable travel experiences by connecting people with unique destinations through carefully designed packages, fair prices and personal service. We believe traveling transforms, and every itinerary should live up to that transformation.

nosotros.vision.titulo=Our vision
nosotros.vision.texto=To be the leading travel agency in southern Colombia for those seeking authentic, sustainable and thoughtfully planned trips. To grow while staying true to our values and the personal service that sets us apart.

nosotros.valores.titulo=What defines us
nosotros.valores.subtitulo=Four principles that guide every package we build.

nosotros.valor1.titulo=Passion for travel
nosotros.valor1.texto=We know every destination we offer. We don't sell places, we sell experiences we have lived first.

nosotros.valor2.titulo=Trust
nosotros.valor2.texto=Transparent prices, clear terms, no surprises. What you see is what you get.

nosotros.valor3.titulo=Sustainability
nosotros.valor3.texto=We prioritize local providers and responsible practices that minimize environmental impact.

nosotros.valor4.titulo=Quality
nosotros.valor4.texto=Every detail of a package is reviewed by us before going on sale. If we wouldn't go ourselves, we don't offer it.