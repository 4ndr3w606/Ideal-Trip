# ============== SOBRE NÓS ==============
nosotros.titulo=Sobre nós · Ideal-Trip
nosotros.hero.titulo=Sobre a Ideal-Trip
nosotros.hero.subtitulo=Criamos viagens que se tornam lembranças.

nosotros.mision.titulo=Nossa missão
nosotros.mision.texto=Facilitar o acesso a experiências de viagem memoráveis, conectando pessoas a destinos únicos por meio de pacotes desenhados com critério, preços justos e atendimento próximo. Acreditamos que viajar transforma, e que cada itinerário deve estar à altura dessa transformação.

nosotros.vision.titulo=Nossa visão
nosotros.vision.texto=Ser a agência de referência no sul da Colômbia para quem busca viagens autênticas, sustentáveis e cuidadosamente planejadas. Crescer sendo fiéis aos nossos valores e ao atendimento personalizado que nos distingue.

nosotros.valores.titulo=O que nos define
nosotros.valores.subtitulo=Quatro princípios que guiam cada pacote que montamos.

nosotros.valor1.titulo=Paixão por viajar
nosotros.valor1.texto=Conhecemos cada destino que oferecemos. Não vendemos lugares, vendemos experiências que já vivemos.

nosotros.valor2.titulo=Confiança
nosotros.valor2.texto=Preços transparentes, condições claras, sem surpresas. O que você vê é o que recebe.

nosotros.valor3.titulo=Sustentabilidade
nosotros.valor3.texto=Priorizamos fornecedores locais e práticas responsáveis que minimizem o impacto ambiental.

nosotros.valor4.titulo=Qualidade
nosotros.valor4.texto=Cada detalhe do pacote é revisado por nós antes de entrar à venda. Se nós mesmos não iríamos, não oferecemos.

