# ============== NOSOTROS ==============
nosotros.titulo=Nosotros · Ideal-Trip
nosotros.hero.titulo=Sobre Ideal-Trip
nosotros.hero.subtitulo=Diseñamos viajes que se vuelven recuerdos.

nosotros.mision.titulo=Nuestra misión
nosotros.mision.texto=Facilitar el acceso a experiencias de viaje memorables, conectando a personas con destinos únicos a través de paquetes diseñados con criterio, precios justos y atención cercana. Creemos que viajar transforma, y que cada itinerario debe estar a la altura de esa transformación.

nosotros.vision.titulo=Nuestra visión
nosotros.vision.texto=Ser la agencia de referencia en el sur de Colombia para quienes buscan viajes auténticos, sostenibles y cuidadosamente planificados. Crecer siendo fieles a nuestros valores y al servicio personalizado que nos distingue.

nosotros.valores.titulo=Lo que nos define
nosotros.valores.subtitulo=Cuatro principios que guían cada paquete que armamos.

nosotros.valor1.titulo=Pasión por viajar
nosotros.valor1.texto=Cada destino que ofrecemos lo conocemos. No vendemos lugares, vendemos experiencias que vivimos primero.

nosotros.valor2.titulo=Confianza
nosotros.valor2.texto=Precios transparentes, condiciones claras, sin sorpresas. Lo que ves es lo que recibís.

nosotros.valor3.titulo=Sostenibilidad
nosotros.valor3.texto=Priorizamos proveedores locales y prácticas responsables que minimicen el impacto ambiental.

nosotros.valor4.titulo=Calidad
nosotros.valor4.texto=Cada detalle del paquete es revisado por nosotros antes de salir a venta. Si no nos iríamos, no lo ofrecemos.