<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:replace="~{fragments/layout :: head(#{registro.titulo})}"></head>

<body>

<header th:replace="~{fragments/layout :: navbar}"></header>

<section class="section">
    <div class="container">
        <div class="auth-card">
            <h1 class="section__title" th:text="#{registro.crearCuenta}">Crear cuenta</h1>

            <form th:action="@{/registro}" th:object="${registroDto}"
                  method="post" class="auth-form" novalidate>

                <div class="form-group">
                    <label for="nombre" th:text="#{form.nombre}">Nombre</label>
                    <input type="text" id="nombre" th:field="*{nombre}" class="form-control">
                    <small class="error-msg"
                           th:if="${#fields.hasErrors('nombre')}"
                           th:errors="*{nombre}">Error</small>
                </div>

                <div class="form-group">
                    <label for="apellido" th:text="#{form.apellido}">Apellido</label>
                    <input type="text" id="apellido" th:field="*{apellido}" class="form-control">
                    <small class="error-msg"
                           th:if="${#fields.hasErrors('apellido')}"
                           th:errors="*{apellido}">Error</small>
                </div>

                <div class="form-group">
                    <label for="email" th:text="#{form.email}">Email</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control">
                    <small class="error-msg"
                           th:if="${#fields.hasErrors('email')}"
                           th:errors="*{email}">Error</small>
                </div>

                <div class="form-group">
                    <label for="telefono" th:text="#{form.telefono}">Teléfono (opcional)</label>
                    <input type="tel" id="telefono" th:field="*{telefono}" class="form-control">
                    <small class="error-msg"
                           th:if="${#fields.hasErrors('telefono')}"
                           th:errors="*{telefono}">Error</small>
                </div>

                <div class="form-group">
                    <label for="password" th:text="#{form.contrasena}">Contraseña</label>
                    <input type="password" id="password" th:field="*{password}" class="form-control">
                    <small class="error-msg"
                           th:if="${#fields.hasErrors('password')}"
                           th:errors="*{password}">Error</small>
                </div>

                <div class="form-group">
                    <label for="confirmarPassword" th:text="#{form.confirmarContrasena}">Confirmar contraseña</label>
                    <input type="password" id="confirmarPassword"
                           th:field="*{confirmarPassword}" class="form-control">
                    <small class="error-msg"
                           th:if="${#fields.hasErrors('confirmarPassword')}"
                           th:errors="*{confirmarPassword}">Error</small>
                </div>

                <button type="submit" class="btn btn--primary btn--full btn--lg"
                        th:text="#{registro.crearCuenta.boton}">
                    Crear cuenta
                </button>

                <p class="auth-form__alt">
                    <span th:text="#{registro.yaTienesCuenta}">¿Ya tienes cuenta?</span>
                    <a th:href="@{/login}" th:text="#{registro.iniciaSesion}">Inicia sesión aquí</a>
                </p>
            </form>
        </div>
    </div>
</section>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
