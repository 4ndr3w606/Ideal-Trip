<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es">

<head th:replace="~{fragments/layout :: head(${destino.nombre} + ' · Ideal-Trip')}"></head>

<body>

<header th:replace="~{fragments/layout :: navbar}"></header>

<!-- ===== HERO del destino ===== -->
<section class="hero"
         th:style="${destino.imagenUrl != null}
                   ? |background-image: url(${destino.imagenUrl})|
                   : ''">
    <div class="hero__overlay"></div>
    <div class="hero__content">
        <h1 class="hero__title" th:text="${destino.nombre}">Destino</h1>
        <p class="hero__subtitle"
           th:text="|${destino.pais} · ${destino.continente}|">País · Continente</p>
    </div>
</section>

<!-- ===== Descripción ===== -->
<section class="section">
    <div class="container">
        <h2 class="section__title">Sobre este destino</h2>
        <p class="section__text" th:text="${destino.descripcion}">Descripción...</p>
        <p class="section__text">
            Precio base desde
            <strong th:text="'$' + ${#numbers.formatInteger(destino.precioBase, 0, 'POINT')}">$0</strong>
        </p>
    </div>
</section>

<!-- ===== Paquetes del destino ===== -->
<section class="section section--gray">
    <div class="container">
        <h2 class="section__title">Paquetes disponibles</h2>

        <p th:if="${#lists.isEmpty(paquetes)}" class="section__subtitle">
            Este destino aún no tiene paquetes disponibles.
        </p>

        <div th:unless="${#lists.isEmpty(paquetes)}" class="paquetes-grid">

            <div th:each="p : ${paquetes}" class="paquete-card">
                <div class="paquete-card__body">
                    <span class="badge badge--outline" th:text="${p.tipo}">Tipo</span>
                    <h3 class="paquete-card__dest" th:text="${p.nombre}">Nombre del paquete</h3>
                    <p class="paquete-card__incluye" th:text="${p.incluye}">Lo que incluye</p>
                    <ul class="paquete-card__list">
                        <li th:text="${p.duracionDias} + ' días'">7 días</li>
                        <li th:text="'Cupos disponibles: ' + ${p.cuposDisponibles}">Cupos: 0</li>
                    </ul>
                    <a th:href="@{/paquetes/{id}(id=${p.id})}" class="btn btn--primary btn--full">
                        Reservar por
                        <span th:text="'$' + ${#numbers.formatInteger(p.precio, 0, 'POINT')}">$0</span>
                    </a>
                </div>
            </div>

        </div>

        <div class="como__cta mt-4">
            <a th:href="@{/destinos}" class="btn btn--outline">← Volver a destinos</a>
        </div>
    </div>
</section>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
