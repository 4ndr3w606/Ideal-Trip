<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:replace="~{fragments/layout :: head('Admin · Destinos')}"></head>

<body>

<header th:replace="~{fragments/layout :: navbar}"></header>

<div class="container">
    <nav th:replace="~{fragments/layout :: adminNav}"></nav>

    <div style="display: flex; justify-content: space-between; align-items: center; margin: 1rem 0;">
        <h1 class="section__title" style="margin:0;">Destinos</h1>
        <a th:href="@{/admin/destinos/nuevo}" class="btn btn--primary">+ Nuevo destino</a>
    </div>

    <div th:if="${mensajeExito}" class="alert alert-success" th:text="${mensajeExito}"></div>

    <p th:if="${#lists.isEmpty(destinos)}" class="section__subtitle">
        No hay destinos registrados.
    </p>

    <table th:unless="${#lists.isEmpty(destinos)}" class="admin-table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>País</th>
            <th>Continente</th>
            <th>Precio base</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="d : ${destinos}"
            th:classappend="${!d.activo} ? 'admin-table__inactivo'">
            <td th:text="${d.id}">1</td>
            <td th:text="${d.nombre}">Nombre</td>
            <td th:text="${d.pais}">País</td>
            <td th:text="${d.continente}">Continente</td>
            <td th:text="'$' + ${#numbers.formatInteger(d.precioBase, 0, 'POINT')}">$0</td>
            <td>
                <span th:if="${d.activo}" class="badge badge--confirmada">Activo</span>
                <span th:unless="${d.activo}" class="badge badge--cancelada">Inactivo</span>
            </td>
            <td class="admin-table__acciones">
                <a th:href="@{/admin/destinos/{id}/editar(id=${d.id})}"
                   class="btn btn--outline btn--sm">Editar</a>

                <form th:if="${d.activo}"
                      th:action="@{/admin/destinos/{id}/desactivar(id=${d.id})}"
                      method="post"
                      onsubmit="return confirm('¿Desactivar este destino?');"
                      style="display: inline;">
                    <button type="submit" class="btn btn--danger btn--sm">Desactivar</button>
                </form>

                <form th:unless="${d.activo}"
                      th:action="@{/admin/destinos/{id}/activar(id=${d.id})}"
                      method="post"
                      style="display: inline;">
                    <button type="submit" class="btn btn--primary btn--sm">Activar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
