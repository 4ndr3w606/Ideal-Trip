<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:replace="~{fragments/layout :: head('Iniciar sesión · Ideal-Trip')}"></head>

<body>

<header th:replace="~{fragments/layout :: navbar}"></header>

<section class="section">
    <div class="container">
        <div class="auth-card">
            <h1 class="section__title">Iniciar sesión</h1>

            <!-- Mensaje flash tras registro exitoso -->
            <div th:if="${mensajeExito}" class="alert alert-success" th:text="${mensajeExito}">
                Mensaje
            </div>

            <!-- Mensaje tras logout -->
            <div th:if="${param.logout}" class="alert alert-info">
                Has cerrado sesión correctamente.
            </div>

            <!-- Error de credenciales tradicionales -->
            <div th:if="${param.error}" class="alert alert-danger">
                Email o contraseña incorrectos.
            </div>

            <!-- Error de OAuth -->
            <div th:if="${param.oauthError}" class="alert alert-danger">
                No se pudo iniciar sesión con Google. Verificá que tu cuenta esté activa
                o intentá nuevamente.
            </div>

            <form th:action="@{/login}" method="post" class="auth-form">

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email"
                           class="form-control" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password"
                           class="form-control" required>
                </div>

                <button type="submit" class="btn btn--primary btn--full btn--lg">
                    Entrar
                </button>
            </form>

            <!-- Separador visual -->
            <div class="auth-form__divider">
                <span>o</span>
            </div>

            <!-- Login con Google -->
            <a th:href="@{/oauth2/authorization/google}"
               class="btn btn--google btn--full btn--lg">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48"
                     style="vertical-align: middle; margin-right: 8px;">
                    <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8c-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4C12.955 4 4 12.955 4 24s8.955 20 20 20s20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
                    <path fill="#FF3D00" d="m6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4C16.318 4 9.656 8.337 6.306 14.691z"/>
                    <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
                    <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002l6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
                </svg>
                Iniciar sesión con Google
            </a>

            <p class="auth-form__alt">
                ¿No tienes cuenta?
                <a th:href="@{/registro}">Regístrate aquí</a>
            </p>
        </div>
    </div>
</section>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
