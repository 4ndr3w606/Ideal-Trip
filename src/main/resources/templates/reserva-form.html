<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:replace="~{fragments/layout :: head('Reservar paquete · Ideal-Trip')}"></head>

<body>

<header th:replace="~{fragments/layout :: navbar}"></header>

<section class="section">
    <div class="container">
        <div class="auth-card">
            <h1 class="section__title">Reservar paquete</h1>

            <!-- Resumen del paquete -->
            <div class="reserva-resumen">
                <h3 th:text="${paquete.nombre}">Paquete</h3>
                <p th:text="|Destino: ${paquete.destino.nombre}, ${paquete.destino.pais}|">Destino</p>
                <ul>
                    <li th:text="|Duración: ${paquete.duracionDias} días|">Duración</li>
                    <li th:text="|Cupos disponibles: ${paquete.cuposDisponibles}|">Cupos</li>
                    <li>
                        Precio por persona:
                        <strong th:text="'$' + ${#numbers.formatInteger(paquete.precio, 0, 'POINT')}">$0</strong>
                    </li>
                </ul>
            </div>

            <form th:action="@{/reservas}" th:object="${reservaDto}"
                  method="post" class="auth-form" novalidate>

                <!-- paqueteId viaja oculto -->
                <input type="hidden" th:field="*{paqueteId}">

                <div class="form-group">
                    <label for="fechaViaje">Fecha de viaje</label>
                    <input type="datetime-local" id="fechaViaje" th:field="*{fechaViaje}"
                           class="form-control">
                    <small class="error-msg"
                           th:if="${#fields.hasErrors('fechaViaje')}"
                           th:errors="*{fechaViaje}">Error</small>
                </div>

                <div class="form-group">
                    <label for="cantidadPersonas">Cantidad de personas</label>
                    <input type="number" id="cantidadPersonas" th:field="*{cantidadPersonas}"
                           class="form-control" min="1" th:max="${paquete.cuposDisponibles}">
                    <small class="error-msg"
                           th:if="${#fields.hasErrors('cantidadPersonas')}"
                           th:errors="*{cantidadPersonas}">Error</small>
                </div>

                <div class="form-group">
                    <label for="descripcion">Observaciones (opcional)</label>
                    <textarea id="descripcion" th:field="*{descripcion}" class="form-control"
                              rows="3" maxlength="500"></textarea>
                    <small class="error-msg"
                           th:if="${#fields.hasErrors('descripcion')}"
                           th:errors="*{descripcion}">Error</small>
                </div>

                <button type="submit" class="btn btn--primary btn--full btn--lg">
                    Confirmar reserva
                </button>

                <p class="auth-form__alt">
                    <a th:href="@{/paquetes/{id}(id=${paquete.id})}">← Volver al paquete</a>
                </p>
            </form>
        </div>
    </div>
</section>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
