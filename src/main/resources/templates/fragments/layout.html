<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es">

<!-- ==================== HEAD ==================== -->
<head th:fragment="head(titulo)">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${titulo}">Ideal-Trip</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
</head>
<body>

<!-- ==================== NAVBAR ==================== -->
<header th:fragment="navbar" class="navbar">
    <div class="container navbar__inner">

        <a th:href="@{/}" class="navbar__logo">
            <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="3" fill="currentColor"/>
                <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            Ideal-Trip
        </a>



        <nav class="navbar__links">
            <a th:href="@{/destinos}" class="navbar__link">Destinos</a>
            <a th:href="@{/paquetes}" class="navbar__link">Paquetes</a>
            <a sec:authorize="isAuthenticated()" th:href="@{/mis-reservas}" class="navbar__link">Mis reservas</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}" class="navbar__link navbar__link--admin">Admin</a>
            <a href="#nosotros" class="navbar__link">Nosotros</a>
            <a href="#contacto" class="navbar__link">Contacto</a>
        </nav>

        <div class="navbar__actions">
            <!-- Si el usuario NO está autenticado: muestra registro y login -->
            <div sec:authorize="!isAuthenticated()">
                <a th:href="@{/registro}" class="btn btn--primary">Registrarse</a>
                <a th:href="@{/login}" class="btn btn--primary">Iniciar sesión</a>
            </div>
            <!-- Si SÍ está autenticado: saluda y muestra cerrar sesión -->
            <div sec:authorize="isAuthenticated()" class="navbar__usuario">
                <span >
                    Hola, <span sec:authentication="name">usuario</span>
                </span>
                <form th:action="@{/logout}" method="post" style="display:inline">
                    <button type="submit" class="btn btn--outline btn--primary">Cerrar sesión</button>
                </form>
            </div>
        </div>

    </div>


</header>

<div>
    <!-- ==================== SUB-NAV ADMIN ==================== -->
    <nav th:fragment="adminNav" class="admin-nav">
        <a th:href="@{/admin}" class="admin-nav__link">Dashboard</a>
        <a th:href="@{/admin/reservas}" class="admin-nav__link">Reservas</a>
        <a th:href="@{/admin/destinos}" class="admin-nav__link">Destinos</a>
        <a th:href="@{/admin/paquetes}" class="admin-nav__link">Paquetes</a>
    </nav>
</div>

<!-- ==================== FOOTER ==================== -->
<footer th:fragment="footer" class="footer" id="contacto">
    <div class="container footer__inner">

        <div class="footer__brand">
            <a th:href="@{/}" class="navbar__logo footer__logo">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="12" r="3" fill="currentColor"/>
                    <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                Ideal-Trip
            </a>
            <p class="footer__tagline">Your favorite hotel booking experience<br>since 1997</p>
        </div>



        <nav class="footer__links">
            <a th:href="@{/admin}" class="footer__link">Dashboard</a>
            <a th:href="@{/admin/destinos}" class="footer__link">Destinos</a>
            <a th:href="@{/admin/paquetes}" class="footer__link">Paquetes</a>
        </nav>


    </div>
    <div class="footer__bottom">
        <p>© 2026 Ideal-Trip · Todos los derechos reservados</p>
    </div>
</footer>

</body>
</html>
