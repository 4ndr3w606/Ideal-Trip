<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:replace="~{fragments/layout :: head('Error del servidor · Ideal-Trip')}"></head>

<body>

<header th:replace="~{fragments/layout :: navbar}"></header>

<section class="section">
    <div class="container error-page">
        <h1 class="error-page__codigo">500</h1>
        <h2 class="section__title">Algo salió mal</h2>
        <p class="section__subtitle"
           th:text="${mensaje} ?: 'Ocurrió un error inesperado. Por favor intenta de nuevo más tarde.'">
            Ocurrió un error inesperado.
        </p>
        <a th:href="@{/}" class="btn btn--primary btn--lg">Volver al inicio</a>
    </div>
</section>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
